<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aula Segura</title>
  <link rel="icon" href="favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  

  <script>
    window.MathJax = { tex: { inlineMath: [['\\(','\\)']] }, startup: { typeset: false } };
  </script>
 <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" defer></script>

  <!-- MathQuill (editor interactivo) -->
  <link  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-inner">
      <a href="#/" class="nav-brand">
        <img src="logo.png" alt="AulaSegura"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        />
        <!-- Fallback si la imagen no carga -->
        <div class="nav-brand-icon" aria-hidden="true" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.35C17.25 22.15 21 17.25 21 12V7L12 2z" fill="rgba(255,255,255,.25)" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </a>
      <div class="nav-actions" id="nav-actions">
        <button class="btn btn-outline" id="theme-toggle">🌙 Oscuro</button>
        <a href="#/login" class="btn btn-primary">Ingresar</a>
        <a href="#/register" class="btn btn-outline">Crear cuenta</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor principal -->
  <div id="app"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Core -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/email.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rag.js"></script>
  <script src="js/chat.js"></script>

  <!-- Páginas -->
  <script src="pages/home.js"></script>
  <script src="pages/login.js"></script>
  <script src="pages/register.js"></script>
  <script src="pages/guest.js"></script>
  <script src="pages/student.js"></script>
  <script src="pages/teacher.js"></script>
  <script src="pages/monitor.js"></script>
  <script src="pages/results.js"></script>
  <script src="pages/examenes.js"></script>
  <script src="pages/perfil.js"></script>

  <!-- Router (debe ir último) -->
  <script src="js/app.js"></script>

</body>
</html>
