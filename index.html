<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Aula Segura</title>
  <link rel="icon" href="favicon.ico"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  

  <script>
    window.MathJax = { tex: { inlineMath: [['\\(','\\)']] }, startup: { typeset: false } };
  </script>
 <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" defer></script>

  <!-- MathQuill (editor interactivo) -->
  <link  rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-inner">
      <a href="#/" class="nav-brand">
        <!-- Logo SVG animado — escudo con candado -->
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" class="nav-logo-svg">
          <defs>
            <linearGradient id="shieldGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1e3a5f"/>
              <stop offset="100%" stop-color="#2563eb"/>
            </linearGradient>
            <linearGradient id="lockGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
          </defs>
          <!-- Escudo -->
          <path d="M22 3L5 10v10c0 9.5 7.2 18.4 17 20.9C31.8 38.4 39 29.5 39 20V10L22 3z"
            fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-linejoin="round">
            <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
          </path>
          <!-- Brillo interior del escudo -->
          <path d="M22 7L9 13v8c0 7.5 5.7 14.5 13 16.5C29.3 35.5 35 28.5 35 21v-8L22 7z"
            fill="rgba(255,255,255,0.07)"/>
          <!-- Cuerpo del candado -->
          <rect x="15" y="22" width="14" height="10" rx="2.5"
            fill="url(#lockGrad)" opacity="0.95"/>
          <!-- Arco del candado -->
          <path d="M17 22v-3.5a5 5 0 0 1 10 0V22"
            stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none">
            <animate attributeName="stroke-dasharray" values="0,30;30,0;30,0" dur="2s" begin="0.5s" fill="freeze"/>
            <animate attributeName="stroke-dashoffset" values="30;0;0" dur="2s" begin="0.5s" fill="freeze"/>
          </path>
          <!-- Ojo del candado -->
          <circle cx="22" cy="26.5" r="1.8" fill="#1e3a5f">
            <animate attributeName="r" values="1.8;2.2;1.8" dur="2.5s" repeatCount="indefinite"/>
          </circle>
          <!-- Check mark animado -->
          <path d="M17 27.5l2.5 2.5 5-5" stroke="#1e3a5f" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1;0" dur="4s" repeatCount="indefinite"/>
          </path>
        </svg>
        <span class="nav-brand-text">Aula<strong>Segura</strong></span>
      </a>
      <div class="nav-actions" id="nav-actions">
        <button class="btn btn-outline" id="theme-toggle">🌙 Oscuro</button>
        <a href="#/login" class="btn btn-primary">Ingresar</a>
        <a href="#/register" class="btn btn-outline">Crear cuenta</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor principal -->
  <div id="app"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- Core -->
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/email.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rag.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/accessibility.js"></script>

  <!-- Páginas -->
  <script src="pages/home.js"></script>
  <script src="pages/login.js"></script>
  <script src="pages/register.js"></script>
  <script src="pages/guest.js"></script>
  <script src="pages/student.js"></script>
  <script src="pages/teacher.js"></script>
  <script src="pages/monitor.js"></script>
  <script src="pages/results.js"></script>
  <script src="pages/examenes.js"></script>
  <script src="pages/perfil.js"></script>

  <!-- Router (debe ir último) -->
  <script src="js/app.js"></script>

</body>
</html>
